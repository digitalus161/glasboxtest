<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkstattbuch – Offene Werkstatt</title>
</head>
<body>
<style>
:root {
  --blue-ink: #555555;
  --blue-navy: #004282;
  --blue-paper: #FFFFFF;
  --blue-line: #00A0AA;
  --blue-line-soft: #BFE1E3;
  --amber: #00A0AA;
  --amber-dark: #EA4F07;
}
* { box-sizing: border-box; }
html { width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
body { width: 100%; min-width: 320px; margin: 0; overflow-x: hidden; }
.sheet {
  font-family: 'Courier New', ui-monospace, monospace;
  background: var(--blue-paper);
  color: var(--blue-ink);
  border: 2px solid var(--blue-navy);
  position: relative;
  padding: 0;
  max-width: 720px;
  margin: 0 auto;
}
.sheet::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid var(--blue-line-soft);
  pointer-events: none;
}
.corner {
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--blue-navy);
}
.corner.tl { top: 2px; left: 2px; border-right: none; border-bottom: none; }
.corner.tr { top: 2px; right: 2px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 2px; left: 2px; border-right: none; border-top: none; }
.corner.br { bottom: 2px; right: 2px; border-left: none; border-top: none; }
.titleblock {
  border-top: 2px solid var(--blue-navy);
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  grid-template-areas: "projekt a11y datum kw count";
}
.tb-projekt { grid-area: projekt; }
.tb-a11y { grid-area: a11y; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tb-datum { grid-area: datum; }
.tb-kw { grid-area: kw; }
.tb-count { grid-area: count; }
.tb-cell {
  padding: 6px 12px;
  border-left: 1px solid var(--blue-line);
  font-size: 11px;
  letter-spacing: 0.03em;
}
.tb-cell:first-child { border-left: none; }
.tb-label { color: var(--blue-line); text-transform: uppercase; font-size: 9px; }
.tb-value { font-weight: bold; font-size: 13px; }
.field-row { padding: 14px 20px; border-top: 1px solid var(--blue-line-soft); }
.field-row:first-of-type { border-top: none; }
label.field-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--blue-navy);
  margin-bottom: 5px;
}
.field-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  background: var(--amber);
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  line-height: 1;
}
input[type=text], select {
  width: 100%;
  border: none;
  border-bottom: 1.5px solid var(--blue-line);
  background: transparent;
  font-family: inherit;
  font-size: 17px;
  padding: 6px 2px;
  color: var(--blue-ink);
  outline: none;
}
input[type=text]:focus, select:focus { border-bottom-color: var(--amber); }
.origin-toggle { display: flex; gap: 10px; margin-top: 4px; }
.origin-btn {
  flex: 1;
  padding: 12px 8px;
  border: 1.5px solid var(--blue-line);
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  color: var(--blue-navy);
  cursor: pointer;
}
.origin-btn.active { background: var(--amber-dark); color: #fff; border-color: var(--amber-dark); font-weight: bold; }
.sig-wrap { border: 1.5px solid var(--blue-line); position: relative; touch-action: none; }
canvas#sig { display: block; width: 100%; height: 140px; touch-action: none; }
.sig-line { position: absolute; left: 12px; right: 12px; bottom: 32px; border-top: 1px dashed var(--blue-line); pointer-events: none; }
.sig-clear { position: absolute; top: 4px; right: 4px; font-size: 10px; background: none; border: 1px solid var(--blue-line); color: var(--blue-navy); padding: 3px 8px; cursor: pointer; }
.submit-row { padding: 16px 20px 20px; }
button.submit {
  width: 100%;
  padding: 16px;
  background: var(--amber-dark);
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.04em;
  cursor: pointer;
}
button.submit:active { background: var(--blue-navy); }
.stamp {
  display: none;
  text-align: center;
  padding: 30px 20px;
  color: var(--amber-dark);
}
.stamp .mark {
  display: inline-block;
  border: 3px solid var(--amber-dark);
  padding: 10px 24px;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.1em;
  transform: rotate(-4deg);
}
.stamp p { font-size: 12px; color: var(--blue-navy); margin-top: 12px; }
.footer-row {
  border-top: 1px solid var(--blue-line-soft);
  padding: 8px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  color: var(--blue-line);
}
.footer-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 12px; }
.footer-row button {
  background: none;
  border: none;
  color: var(--blue-navy);
  text-decoration: underline;
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  padding: 0;
}
.footer-row button[aria-expanded="true"] { color: var(--amber-dark); font-weight: bold; }
.log-panel { display: none; border-top: 2px solid var(--blue-navy); padding: 14px 20px; max-height: 260px; overflow-y: auto; }
.log-entry { border-bottom: 1px dotted var(--blue-line-soft); padding: 8px 0; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.log-entry > span { min-width: 0; overflow-wrap: anywhere; }
.log-entry img { height: 24px; }
.log-actions { padding: 8px 20px 16px; display: flex; gap: 10px; }
.log-actions button { flex: 1; font-size: 11px; padding: 8px; border: 1px solid var(--blue-line); background: transparent; font-family: inherit; cursor: pointer; }
.log-actions button:disabled { cursor: wait; opacity: 0.65; }
#upload-cloud { background: var(--amber-dark); color: #fff; border-color: var(--amber-dark); font-weight: bold; }
.upload-status { min-height: 16px; color: var(--blue-navy); font-size: 11px; text-align: center; }
.admin-heading { margin: 4px 0 2px; color: var(--amber-dark); font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; }
.daily-note-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blue-navy); margin-bottom: 5px; }
.daily-note { width: 100%; min-height: 82px; resize: vertical; border: 1px solid var(--blue-line); background: transparent; color: var(--blue-ink); font: 13px/1.4 inherit; padding: 8px; outline: none; }
.daily-note:focus { border-color: var(--amber); }
.hidden { display: none !important; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(22,32,43,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-box {
  background: var(--blue-paper); border: 2px solid var(--blue-navy);
  max-width: 340px; width: 100%; padding: 20px; font-family: inherit;
}
.modal-box p { font-size: 14px; color: var(--blue-ink); margin: 0 0 18px; line-height: 1.4; }
.modal-password-input { width: 100%; margin: -6px 0 18px; border: 1.5px solid var(--blue-line); background: transparent; color: var(--blue-ink); font: 16px inherit; padding: 10px; outline: none; }
.modal-password-input:focus { border-color: var(--amber); }
.modal-cloud-input { width: 100%; margin: 0 0 10px; border: 1.5px solid var(--blue-line); background: transparent; color: var(--blue-ink); font: 16px inherit; padding: 10px; outline: none; }
.modal-cloud-input:focus { border-color: var(--amber); }
.modal-check { display: flex; align-items: center; gap: 7px; margin: 0 0 18px; color: var(--blue-ink); font-size: 12px; }
.modal-buttons { display: flex; gap: 10px; }
.modal-buttons button {
  flex: 1; padding: 12px; font-family: inherit; font-size: 13px; cursor: pointer;
  border: 1.5px solid var(--blue-navy); background: transparent; color: var(--blue-navy);
}
.modal-buttons button.primary { background: var(--amber-dark); color: #fff; border-color: var(--amber-dark); font-weight: bold; }
@media (max-width: 820px) {
  .sheet { width: 100%; max-width: none; min-height: 100dvh; border-left: none; border-right: none; }
  .titleblock {
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "projekt a11y"
      "datum kw"
      "count count";
  }
  .tb-cell:nth-child(3), .tb-cell:nth-child(5) { border-left: none; }
  .field-row, .submit-row, .log-panel, .log-actions { padding-left: 16px; padding-right: 16px; }
  .footer-row { align-items: flex-start; flex-direction: column; }
  .footer-actions { width: 100%; justify-content: space-between; }
  .footer-row button { min-height: 28px; }
  .daily-note, .modal-cloud-input, .modal-password-input { font-size: 16px; }
}
.a11y-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: inherit;
  font-size: 11px;
  font-weight: bold;
  border: 1.5px solid var(--blue-navy);
  background: var(--blue-navy);
  color: #fff;
  padding: 6px 9px;
  min-height: 34px;
  min-width: 34px;
  cursor: pointer;
  border-radius: 3px;
  flex: 0 0 auto;
  white-space: nowrap;
}
#text-size-toggle { background: var(--blue-line); border-color: var(--blue-line); }
.a11y-btn[aria-pressed="true"] { background: var(--amber-dark); color: #fff; border-color: var(--amber-dark); }
body.large-text .field-label { font-size: 13px; }
body.large-text .field-number { width: 22px; height: 22px; flex: 0 0 22px; font-size: 13px; }
body.large-text input[type=text], body.large-text select, body.large-text .daily-note { font-size: 21px; }
body.large-text .origin-btn { font-size: 16px; padding: 15px 10px; }
body.large-text button.submit { font-size: 19px; padding: 20px; }
body.large-text .sig-clear { font-size: 13px; padding: 6px 10px; }
body.large-text .tb-label { font-size: 11px; }
body.large-text .tb-value { font-size: 16px; }
body.large-text .stamp .mark { font-size: 24px; }
body.large-text .stamp p { font-size: 15px; }
body.large-text .footer-row { font-size: 13px; }
body.large-text .footer-row button { font-size: 13px; }
body.large-text .a11y-btn { font-size: 14px; padding: 9px 13px; }
body.large-text .admin-heading { font-size: 12px; }
body.large-text .daily-note-label { font-size: 12px; }
body.large-text .log-actions button { font-size: 14px; padding: 11px; }
body.large-text .upload-status { font-size: 13px; }
body.large-text .log-entry { font-size: 15px; }
body.large-text .modal-box p { font-size: 17px; }
body.large-text .modal-buttons button { font-size: 15px; padding: 14px; }
body.large-text .modal-password-input, body.large-text .modal-cloud-input { font-size: 18px; }
body.large-text .modal-check { font-size: 14px; }
</style>

<div class="sheet" id="sheet">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="titleblock">
    <div class="tb-cell tb-projekt">
      <div class="tb-label" data-i18n="tbProjekt">Projekt</div>
      <div class="tb-value">Offene Werkstatt</div>
    </div>
    <div class="tb-cell tb-a11y">
      <button type="button" class="a11y-btn" id="lang-toggle"></button>
      <button type="button" class="a11y-btn" id="text-size-toggle" aria-pressed="false">A+</button>
    </div>
    <div class="tb-cell tb-datum">
      <div class="tb-label" data-i18n="tbDatum">Datum</div>
      <div class="tb-value" id="tb-date">—</div>
    </div>
    <div class="tb-cell tb-kw">
      <div class="tb-label" data-i18n="tbKw">KW</div>
      <div class="tb-value" id="tb-kw">—</div>
    </div>
    <div class="tb-cell tb-count">
      <div class="tb-label" data-i18n="tbCount">Lfd. Nr.</div>
      <div class="tb-value" id="tb-count">001</div>
    </div>
  </div>

  <div id="form-area">
    <div class="field-row">
      <label class="field-label"><span class="field-number">1</span><span data-i18n="fieldName">Name</span></label>
      <input type="text" id="f-name" placeholder="Vor- und Nachname" data-i18n-placeholder="fieldNamePlaceholder" autocomplete="off" />
    </div>

    <div class="field-row">
      <label class="field-label"><span class="field-number">2</span><span data-i18n="fieldHerkunft">Herkunft</span></label>
      <div class="origin-toggle" id="herkunft-toggle">
        <button type="button" class="origin-btn active" data-origin="extern" data-i18n="originExtern">Extern</button>
        <button type="button" class="origin-btn" data-origin="fachbereich" data-i18n="originFachbereich">Fachbereich (Uni)</button>
      </div>
    </div>

    <div class="field-row">
      <label class="field-label"><span class="field-number">3</span><span data-i18n="fieldFirstVisit">Erstbesuch?</span></label>
      <div class="origin-toggle" id="first-visit-toggle">
        <button type="button" class="origin-btn" data-first-visit="ja" data-i18n="firstVisitYes">Ja</button>
        <button type="button" class="origin-btn active" data-first-visit="nein" data-i18n="firstVisitNo">Nein</button>
      </div>
    </div>

    <div class="field-row" id="fb-row">
      <label class="field-label"><span class="field-number">4</span><span data-i18n="fieldFachbereich">Welcher Fachbereich?</span></label>
      <select id="f-fachbereich">
        <option value="" data-i18n="fieldFachbereichOption">— auswählen —</option>
        <option value="FB1">FB1</option>
        <option value="FB2">FB2</option>
        <option value="FB3">FB3</option>
        <option value="FB4">FB4</option>
        <option value="FB5">FB5</option>
        <option value="FB6">FB6</option>
        <option value="FB7">FB7</option>
        <option value="FB8">FB8</option>
      </select>
    </div>

    <div class="field-row">
      <label class="field-label"><span class="field-number">5</span><span data-i18n="fieldNote">Grund / Notiz (optional)</span></label>
      <input type="text" id="f-note" placeholder="z.B. 3D-Druck, Beratung, ..." data-i18n-placeholder="fieldNotePlaceholder" autocomplete="off" />
    </div>

    <div class="field-row">
      <label class="field-label"><span class="field-number">6</span><span data-i18n="fieldSignature">Unterschrift</span></label>
      <div class="sig-wrap">
        <canvas id="sig"></canvas>
        <div class="sig-line"></div>
        <button type="button" class="sig-clear" id="sig-clear" data-i18n="sigClear">löschen</button>
      </div>
    </div>

    <div class="submit-row">
      <button class="submit" id="submit-btn" data-i18n="submitBtn">Eintragen</button>
    </div>
  </div>

  <div class="stamp" id="stamp">
    <div class="mark" data-i18n="stampMark">EINGETRAGEN</div>
    <p data-i18n="stampText">Danke — bereit für den nächsten Besucher.</p>
  </div>

  <div class="footer-row">
    <span data-i18n="footerBrand">Werkstattbuch · digital</span>
    <div class="footer-actions">
      <button id="toggle-log" type="button" aria-expanded="false" aria-controls="log-panel" data-i18n="toggleLogShow">Einträge anzeigen</button>
      <button id="admin-toggle" type="button" aria-expanded="false" aria-controls="log-actions" data-i18n="adminOpen">Verwaltung öffnen</button>
    </div>
  </div>

  <div class="log-panel" id="log-panel"></div>
  <div class="log-actions hidden" id="log-actions" style="flex-direction:column;">
    <div class="admin-heading" data-i18n="adminHeading">Verwaltung</div>
    <div style="width:100%;">
      <label class="daily-note-label" for="daily-note" data-i18n="dailyNoteLabel">Tagebuchnotiz für heute</label>
      <textarea class="daily-note" id="daily-note" placeholder="Besondere Ereignisse, Beobachtungen oder offene Punkte ..." data-i18n-placeholder="dailyNotePlaceholder"></textarea>
    </div>
    <div style="display:flex; gap:10px; width:100%;">
      <button id="export-csv" data-i18n="exportCsvBtn">CSV + Tagebuch exportieren</button>
    </div>
    <div style="display:flex; gap:10px; width:100%;">
      <button id="upload-cloud" data-i18n="uploadCloudBtn">In BHT-Cloud hochladen</button>
    </div>
    <div style="display:flex; gap:10px; width:100%;">
      <button id="rebuild-workbook" data-i18n="rebuildWorkbookBtn">Nur Excel-Statistik aktualisieren</button>
    </div>
    <div class="upload-status" id="upload-status" aria-live="polite"></div>
    <div style="display:flex; gap:10px; width:100%;">
      <button id="select-excel-template" type="button" data-i18n="selectExcelTemplateBtn">Excel-Vorlage wählen</button>
      <input id="excel-template-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" />
    </div>
    <div class="upload-status" id="excel-template-status" aria-live="polite"></div>
    <div style="display:flex; gap:10px; width:100%;">
      <button id="manual-clear" style="color:var(--amber-dark); border-color:var(--amber-dark); font-weight:bold;" data-i18n="manualClearBtn">Alle Einträge löschen</button>
      <button id="clear-cloud-login" data-i18n="clearCloudLoginBtn">Cloud-Zugang löschen</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <p id="modal-text"></p>
    <div class="modal-buttons" id="modal-buttons"></div>
  </div>
</div>

  const canvas = document.getElementById('sig');
  const ctx = canvas.getContext('2d');
  let drawing = false, hasSig = false, last = null;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#16202B';
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 50);

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e) { e.preventDefault(); drawing = true; hasSig = true; last = pos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);

  function downloadBlob(blob, filename) {

    const a = document.createElement('a');
    a.href = url;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function encodeBasicAuth(username, password) {
    return btoa(unescape(encodeURIComponent(username + ':' + password)));
  }
  function getCloudFolderParts(category) {

  }
  function getCloudUrl(username, pathParts) {

      encodeURIComponent(username) + '/' + pathParts.map(encodeURIComponent).join('/');
  }
  function cloudHeaders(credentials) {
    return { 'Authorization': 'Basic ' + encodeBasicAuth(credentials.username, credentials.password) };
  }
  async function ensureBhtCloudFolder(credentials, category) {
    const folderParts = getCloudFolderParts(category);
    const currentPath = [];
    for (const folder of folderParts) {
      currentPath.push(folder);
      const response = await fetch(getCloudUrl(credentials.username, currentPath), {
        method: 'MKCOL',
        headers: cloudHeaders(credentials)
      });
      if (!response.ok && response.status !== 405) {
        throw new Error('Ordner ' + currentPath.join('/') + ' konnte nicht angelegt werden (Status ' + response.status + ').');
      }
    }
    return folderParts;
  }
  async function uploadToBhtCloud(filename, content, contentType, credentials, folderParts) {
    const url = getCloudUrl(credentials.username, folderParts.concat(filename));
    const response = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': cloudHeaders(credentials).Authorization,
        'Content-Type': contentType
      },
      body: content
    });
    if (!response.ok) throw new Error('BHT-Cloud antwortet mit Status ' + response.status + '.');
  }
  async function listBhtCloudFiles(credentials, folderParts) {
    const response = await fetch(getCloudUrl(credentials.username, folderParts), {
      method: 'PROPFIND',
      headers: Object.assign(cloudHeaders(credentials), { Depth: '1' })
    });
    if (!response.ok) throw new Error('Die Jahreslisten konnten nicht gelesen werden (Status ' + response.status + ').');
    const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
    return Array.from(xml.getElementsByTagNameNS('*', 'href')).map(function (node) {
      return decodeURIComponent(node.textContent);
    }).filter(function (href) {
      return /\.csv$/i.test(href);
    });
  }
  async function loadBhtCloudFile(url, credentials) {
    const response = await fetch(url, { headers: cloudHeaders(credentials) });
    if (!response.ok) throw new Error('Eine Tagesliste konnte nicht gelesen werden (Status ' + response.status + ').');
    return response.text();
  }

    const rows = [];
    let row = [], value = '', quoted = false;
    for (let i = 0; i < csv.length; i += 1) {
      const character = csv[i];
      if (quoted && character === '"' && csv[i + 1] === '"') { value += '"'; i += 1; }
      else if (character === '"') quoted = !quoted;
      else if (!quoted && character === ';') { row.push(value); value = ''; }
      else if (!quoted && (character === '\n' || character === '\r')) {
        if (character === '\r' && csv[i + 1] === '\n') i += 1;
        row.push(value); rows.push(row); row = []; value = '';
      } else value += character;
    }
    if (value || row.length) { row.push(value); rows.push(row); }
    const headers = (rows.shift() || []).map(function (header) { return header.replace(/^\ufeff/, ''); });
    return rows.filter(function (row) { return row.length > 1; }).map(function (row) {
      const entry = {};
      headers.forEach(function (header, index) { entry[header] = row[index] || ''; });
      return entry;
    });
  }
  const CORRECTION_PERSON_COLUMNS = ['FB1', 'FB2', 'FB3', 'FB4', 'FB5', 'FB6', 'FB7', 'FB8', 'Sonstige', 'Externe', 'Unbekannt'];
  const CORRECTION_VISIT_COLUMNS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'SaSo'];
  function correctionsCsvTemplate() {
    const header = ['KW'].concat(CORRECTION_PERSON_COLUMNS, CORRECTION_VISIT_COLUMNS, ['Kommentar']);
    return header.join(';') + '\n' +
      ';;;;;;;;;;;;;;;;;;Pro Papierliste eine Zeile: KW eintragen, Zahlen in die passenden Spalten schreiben, leere Felder = 0\n';
  }
  function correctionNumber(value) {
    const number = Number(String(value || '').trim().replace(',', '.'));
    return Number.isFinite(number) ? number : 0;
  }
  async function loadCorrections(credentials, listFolderParts, year) {
    const filename = 'Korrekturen_' + year + '.csv';
    const url = getCloudUrl(credentials.username, listFolderParts.concat(filename));
    const response = await fetch(url, { headers: cloudHeaders(credentials) });
    if (response.status === 404) {
      await uploadToBhtCloud(filename, '\ufeff' + correctionsCsvTemplate(), 'text/csv;charset=utf-8;', credentials, listFolderParts);
      return [];
    }
    if (!response.ok) throw new Error('Die Korrekturdatei konnte nicht gelesen werden (Status ' + response.status + ').');
    return parseCsv(await response.text());
  }
  function germanDateToDate(value) {
    const parts = value.split('.');
    return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
  }
  function excelDateSerial(date) {
    return Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);
  }
  function mondaySerial(date) {
    const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const offset = monday.getDay() === 0 ? -6 : 1 - monday.getDay();
    monday.setDate(monday.getDate() + offset);
    return excelDateSerial(monday);
  }
  function columnIndex(reference) {
    const letters = reference.replace(/[0-9]/g, '');
    return letters.split('').reduce(function (value, letter) { return value * 26 + letter.charCodeAt(0) - 64; }, 0);
  }
  function getSheetCell(row, column, document) {
    const cells = Array.from(row.getElementsByTagNameNS('*', 'c'));
    const existing = cells.find(function (cell) { return cell.getAttribute('r').replace(/[0-9]/g, '') === column; });
    if (existing) return existing;
    const cell = document.createElementNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'c');
    cell.setAttribute('r', column + row.getAttribute('r'));
    const targetIndex = columnIndex(column + '1');
    const nextCell = cells.find(function (candidate) { return columnIndex(candidate.getAttribute('r')) > targetIndex; });
    if (nextCell) row.insertBefore(cell, nextCell); else row.appendChild(cell);
    return cell;
  }
  function getSheetCellValue(row, column, document) {
    const value = getSheetCell(row, column, document).getElementsByTagNameNS('*', 'v')[0];
    return value ? Number(value.textContent || 0) : 0;
  }
  function setSheetCellValue(row, column, value, document) {
    const cell = getSheetCell(row, column, document);
    cell.removeAttribute('t');
    let valueNode = cell.getElementsByTagNameNS('*', 'v')[0];
    if (!valueNode) {
      valueNode = document.createElementNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'v');
      cell.appendChild(valueNode);
    }
    valueNode.textContent = String(value);
  }
  function setSheetCellText(row, column, text, document) {
    const cell = getSheetCell(row, column, document);
    cell.setAttribute('t', 'inlineStr');
    Array.from(cell.getElementsByTagNameNS('*', 'f')).forEach(function (node) { node.remove(); });
    Array.from(cell.getElementsByTagNameNS('*', 'v')).forEach(function (node) { node.remove(); });
    let inlineString = cell.getElementsByTagNameNS('*', 'is')[0];
    if (!inlineString) {
      inlineString = document.createElementNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main', 'is');
      cell.appendChild(inlineString);
    }
    let textNode = inlineString.getElementsByTagNameNS('*', 't')[0];
    if (!textNode) {
      textNode = document.createElementNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main', 't');
      inlineString.appendChild(textNode);
    }
    textNode.textContent = text;
  }
  async function buildAnnualWorkbook(entries, corrections) {
    const template = getExcelTemplate();
    if (!template) throw new Error('Bitte zuerst die Excel-Vorlage auswählen.');
    if (!window.JSZip) throw new Error('Die Excel-Bibliothek konnte nicht geladen werden.');
    const zip = await JSZip.loadAsync(dataUrlToArrayBuffer(template));
    const sheetFile = zip.file('xl/worksheets/sheet5.xml');
    if (!sheetFile) throw new Error('Das Blatt „Offene Werkstatt 2026“ wurde in der Vorlage nicht gefunden.');
    const sheet = new DOMParser().parseFromString(await sheetFile.async('text'), 'application/xml');
    const rows = Array.from(sheet.getElementsByTagNameNS('*', 'row')).filter(function (row) { return Number(row.getAttribute('r')) >= 3; });
    const weeklyRows = new Map();
    const weeksByNumber = new Map();
    rows.forEach(function (row) {
      const weekStart = getSheetCellValue(row, 'B', sheet);
      if (!weekStart) return;
      const week = { row: row, people: Array(11).fill(0), visits: Array(6).fill(0), comments: [] };
      weeklyRows.set(weekStart, week);
      const monday = new Date(Date.UTC(1899, 11, 30) + weekStart * 86400000);
      weeksByNumber.set(String(getISOWeek(monday)), week);
    });
    entries.forEach(function (entry) {
      const date = germanDateToDate(entry.Datum);
      const week = weeklyRows.get(mondaySerial(date));
      if (Number.isNaN(date.getTime())) return;
      if (!week) throw new Error('Die Excel-Vorlage enthält keine Wochenzeile für ' + entry.Datum + '.');
      const fbMatch = /^Fachbereich: FB([1-8])$/.exec(entry.Herkunft);
      const personIndex = fbMatch ? Number(fbMatch[1]) - 1 : entry.Herkunft === 'Extern' ? 9 : 10;
      week.people[personIndex] += 1;
      const weekdayIndex = date.getDay() === 0 ? 5 : date.getDay() - 1;
      week.visits[weekdayIndex] += 1;
    });
    corrections.forEach(function (correction) {
      const weekNumber = String(correction.KW || '').split('/')[0].trim();
      const week = weeksByNumber.get(weekNumber);
      if (!week) return;
      const comment = String(correction.Kommentar || '').trim();
      if (comment) week.comments.push(comment);
      CORRECTION_PERSON_COLUMNS.forEach(function (column, index) { week.people[index] += correctionNumber(correction[column]); });
      CORRECTION_VISIT_COLUMNS.forEach(function (column, index) { week.visits[index] += correctionNumber(correction[column]); });
    });
    weeklyRows.forEach(function (week) {
      const personColumns = ['C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M'];
      const visitColumns = ['O', 'P', 'Q', 'R', 'S', 'T'];
      personColumns.forEach(function (column, index) { setSheetCellValue(week.row, column, week.people[index], sheet); });
      visitColumns.forEach(function (column, index) { setSheetCellValue(week.row, column, week.visits[index], sheet); });
      setSheetCellValue(week.row, 'N', week.people.reduce(function (sum, value) { return sum + value; }, 0), sheet);
      setSheetCellValue(week.row, 'U', week.visits.reduce(function (sum, value) { return sum + value; }, 0), sheet);
      if (week.comments.length) setSheetCellText(week.row, 'V', week.comments.join(' | '), sheet);
    });
    zip.file('xl/worksheets/sheet5.xml', new XMLSerializer().serializeToString(sheet));
    return zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
  }
  async function updateAnnualWorkbook(credentials, listFolderParts) {
    const files = await listBhtCloudFiles(credentials, listFolderParts);
    const year = String(today.getFullYear());
    const csvFiles = files.filter(function (file) {
      return file.indexOf('/' + year + '/Listen/') !== -1 && /KW\d+-werkstatt-tagesabschluss-.*\.csv$/i.test(file);
    });
    const entries = (await Promise.all(csvFiles.map(function (file) { return loadBhtCloudFile('https://cloud.bht-berlin.de' + file, credentials); }))).flatMap(parseCsv);
    const corrections = await loadCorrections(credentials, listFolderParts, year);
    const workbook = await buildAnnualWorkbook(entries, corrections);
    await uploadToBhtCloud('Statistik_GLASBOX_Offener_Mittwoch_' + year + '.xlsx', workbook, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', credentials, listFolderParts);
  }

  document.getElementById('manual-clear').addEventListener('click', async function () {
    const entries = await loadEntries();
    if (entries.length === 0) {
      await showAlert(t('alertNoEntriesToDelete'));
      return;
    }
    if (await showConfirm(t('confirmDeleteAll', { count: entries.length }))) {
      await saveEntries([]);
      await renderLog();
      await refreshCount();
    }
  });

  document.getElementById('export-csv').addEventListener('click', async function () {
    const entries = await loadEntries();
    const todayStr = today.toLocaleDateString('de-DE');
    const todaysEntries = entries.filter(function (e) { return e.datum === todayStr; });
    const filenameDate = todayStr.replace(/\./g, '-');

    if (window.JSZip) {
      const zip = new JSZip();
      zip.file('werkstatt-besucher-gesamt.csv', '﻿' + toCsv(entries));
      zip.file(weekFilePrefix() + 'werkstatt-tagebuch-' + filenameDate + '.md', toDiaryMarkdown(todaysEntries, todayStr));
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(blob, weekFilePrefix() + 'werkstatt-export-' + filenameDate + '.zip');
    } else {
      downloadCsv(toCsv(entries), 'werkstatt-besucher-gesamt.csv');
      downloadDiary(todaysEntries, todayStr);
    }

    if (entries.length > 0 && await showConfirm(t('confirmDeleteAfterExport', { count: entries.length }))) {
      await saveEntries([]);
      await renderLog();
      await refreshCount();
    }
  });

  document.getElementById('upload-cloud').addEventListener('click', async function () {
    const entries = await loadEntries();
    const todayStr = today.toLocaleDateString('de-DE');
    const todaysEntries = entries.filter(function (e) { return e.datum === todayStr; });
    if (todaysEntries.length === 0) {
      await showAlert(t('alertNoUploadToday'));
      return;
    }

    const credentials = await showCloudLoginPrompt();
    if (!credentials) return;
    if (credentials.remember) saveCloudCredentials(credentials);

    const uploadButton = document.getElementById('upload-cloud');
    uploadButton.disabled = true;
    uploadButton.textContent = t('uploadCloudBtnBusy');
    const filenameDate = todayStr.replace(/\./g, '-');
    try {
      const listFolderParts = await ensureBhtCloudFolder(credentials, 'Listen');
      const diaryFolderParts = await ensureBhtCloudFolder(credentials, 'Tagebucheintraege');
      await Promise.all([
        uploadToBhtCloud(weekFilePrefix() + 'werkstatt-tagesabschluss-' + filenameDate + '.csv', '\ufeff' + toCsv(todaysEntries), 'text/csv;charset=utf-8;', credentials, listFolderParts),
        uploadToBhtCloud(weekFilePrefix() + 'werkstatt-tagebuch-' + filenameDate + '.md', toDiaryMarkdown(todaysEntries, todayStr), 'text/markdown;charset=utf-8;', credentials, diaryFolderParts)
      ]);
      await updateAnnualWorkbook(credentials, listFolderParts);
      saveUploadStatus();
      await showAlert(t('alertUploadSuccess'));
    } catch (error) {
      await showAlert(t('alertUploadFail', { message: error.message }));
    } finally {
      uploadButton.disabled = false;
      uploadButton.textContent = t('uploadCloudBtn');
    }
  });

  document.getElementById('rebuild-workbook').addEventListener('click', async function () {
    let credentials = loadCloudCredentials();
    if (!credentials) {
      credentials = await showCloudLoginPrompt();
      if (!credentials) return;
      if (credentials.remember) saveCloudCredentials(credentials);
    }

    const rebuildButton = document.getElementById('rebuild-workbook');
    rebuildButton.disabled = true;
    rebuildButton.textContent = t('rebuildWorkbookBtnBusy');
    try {
      const listFolderParts = await ensureBhtCloudFolder(credentials, 'Listen');
      await updateAnnualWorkbook(credentials, listFolderParts);
      saveUploadStatus();
      await showAlert(t('alertRebuildSuccess'));
    } catch (error) {
      await showAlert(t('alertRebuildFail', { message: error.message }));
    } finally {
      rebuildButton.disabled = false;
      rebuildButton.textContent = t('rebuildWorkbookBtn');
    }
  });

  document.getElementById('clear-cloud-login').addEventListener('click', async function () {
    clearCloudCredentials();
    await showAlert(t('alertCloudLoginCleared'));
  });

  function applyStaticTranslations() {
    document.documentElement.lang = currentLang;
    document.title = currentLang === 'en' ? 'Workshop log – Open Workshop' : 'Werkstattbuch – Offene Werkstatt';
    document.querySelectorAll('[data-i18n]').forEach(function (element) {
      element.textContent = t(element.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (element) {
      element.placeholder = t(element.getAttribute('data-i18n-placeholder'));
    });
    document.getElementById('tb-date').textContent = today.toLocaleDateString(currentLang === 'en' ? 'en-GB' : 'de-DE');
  }

  const langToggleBtn = document.getElementById('lang-toggle');
  const textSizeToggleBtn = document.getElementById('text-size-toggle');

  function refreshAccessibilityUi() {
    langToggleBtn.textContent = t('langToggleLabel');
    const largeTextActive = document.body.classList.contains('large-text');
    textSizeToggleBtn.setAttribute('aria-pressed', String(largeTextActive));
    textSizeToggleBtn.setAttribute('aria-label', largeTextActive ? t('textSizeToggleLabelActive') : t('textSizeToggleLabel'));
  }

  function refreshDynamicUi() {
    applyStaticTranslations();
    refreshAccessibilityUi();
    setLogExpanded(toggleBtn.getAttribute('aria-expanded') === 'true');
    setAdminExpanded(!logActions.classList.contains('hidden'));
    if (toggleBtn.getAttribute('aria-expanded') === 'true') renderLog();
    if (!logActions.classList.contains('hidden')) {
      renderUploadStatus();
      renderExcelTemplateStatus();
    }
    if (!document.getElementById('upload-cloud').disabled) {
      document.getElementById('upload-cloud').textContent = t('uploadCloudBtn');
    }
    if (!document.getElementById('rebuild-workbook').disabled) {
      document.getElementById('rebuild-workbook').textContent = t('rebuildWorkbookBtn');
    }
  }

  langToggleBtn.addEventListener('click', function () {
    currentLang = currentLang === 'de' ? 'en' : 'de';
    try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
    refreshDynamicUi();
  });

  try {
    if (localStorage.getItem(TEXT_SIZE_KEY) === 'true') document.body.classList.add('large-text');
  } catch (e) {}

  textSizeToggleBtn.addEventListener('click', function () {
    const active = document.body.classList.toggle('large-text');
    try { localStorage.setItem(TEXT_SIZE_KEY, String(active)); } catch (e) {}
    refreshAccessibilityUi();
  });

  refreshDynamicUi();
})();
</script>
